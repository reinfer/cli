name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    # Only v* tags may deploy to this environment, and only admins and
    # maintainers may create those tags. GCP trusts OIDC tokens from this
    # environment alone.
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock', 'scripts/build-install') }}

      - name: Install build deps
        run: ./scripts/build-install
        env:
          BUILD_PLATFORM: ${{ matrix.os }}

      - name: Build
        run: ./scripts/build

      - name: Run tests
        run: ./scripts/check
        env:
          REINFER_CLI_TEST_PROJECT: ${{ secrets.REINFER_CLI_TEST_PROJECT }}
          REINFER_CLI_TEST_TOKEN: ${{ secrets.REINFER_CLI_TEST_TOKEN }}
          REINFER_CLI_TEST_ENDPOINT: ${{ secrets.REINFER_CLI_TEST_ENDPOINT }}

      - name: Install publish dependencies
        run: ./scripts/publish-install
        env:
          BUILD_PLATFORM: ${{ matrix.os }}

      - name: GCP Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/926089055780/locations/global/workloadIdentityPools/github-actions/providers/reinfer-cli-release
          service_account: publish-reinfer-cli-github-act@reinfer-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        name: Set up Cloud SDK

      - name: Publish Binaries
        run: ./cli/publish-binaries
        env:
          BUILD_PLATFORM: ${{ matrix.os }}

      - name: Publish Crates
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          cargo login ${{ secrets.CRATES_IO_TOKEN }}
          ./scripts/publish
