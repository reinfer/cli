name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    # Same shared test tenant, same lock as the Build workflow: a release is
    # published seconds after its merge is pushed, so without this the two run
    # the integration tests against one tenant at the same time.
    concurrency:
      group: ${{ matrix.os == 'ubuntu-24.04' && 'integration-test-tenant' || format('publish-{0}-{1}', matrix.os, github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup python for gsutil
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock', 'scripts/build-install') }}

      - name: Install build deps
        run: ./scripts/build-install
        env:
          BUILD_PLATFORM: ${{ matrix.os }}

      - name: Build
        run: ./scripts/build

      - name: Run tests
        run: ./scripts/check
        env:
          SKIP_INTEGRATION_TESTS: ${{ matrix.os != 'ubuntu-24.04' && '1' || '0' }}
          REINFER_CLI_TEST_PROJECT: ${{ secrets.REINFER_CLI_TEST_PROJECT }}
          REINFER_CLI_TEST_TOKEN: ${{ secrets.REINFER_CLI_TEST_TOKEN }}
          REINFER_CLI_TEST_ENDPOINT: ${{ secrets.REINFER_CLI_TEST_ENDPOINT }}

      - name: Install publish dependencies
        run: ./scripts/publish-install
        env:
          BUILD_PLATFORM: ${{ matrix.os }}

      - name: GCP Auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v1
        name: Set up Cloud SDK

      - name: Publish Binaries
        run: ./cli/publish-binaries
        env:
          BUILD_PLATFORM: ${{ matrix.os }}

      - name: Publish Crates
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          cargo login ${{ secrets.CRATES_IO_TOKEN }}
          ./scripts/publish
