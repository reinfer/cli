name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock', 'scripts/build-install') }}

      - name: Install build dependencies
        run: sudo apt install pkg-config
      # Needs to be separate job because clippy currently (incorrectly) shares cache with cargo
      # (See https://github.com/rust-lang/rust-clippy/issues/4612)

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    # The integration tests share one test tenant with every other run, so the
    # leg that runs them takes a repository-wide lock, held by the Publish
    # workflow too. The other legs get a group of their own so they are never
    # queued behind it.
    concurrency:
      group: ${{ matrix.os == 'ubuntu-24.04' && 'integration-test-tenant' || format('build-{0}-{1}', matrix.os, github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock', 'scripts/build-install') }}

      - name: Install build deps
        run: ./scripts/build-install
        env:
          BUILD_PLATFORM: ${{ matrix.os }}

      - name: Build
        run: ./scripts/build

      - name: Run tests
        run: ./scripts/check
        env:
          SKIP_INTEGRATION_TESTS: ${{ matrix.os != 'ubuntu-24.04' && '1' || '0' }}
          REINFER_CLI_TEST_PROJECT: ${{ secrets.REINFER_CLI_TEST_PROJECT }}
          REINFER_CLI_TEST_TOKEN: ${{ secrets.REINFER_CLI_TEST_TOKEN }}
          REINFER_CLI_TEST_ENDPOINT: ${{ secrets.REINFER_CLI_TEST_ENDPOINT }}
